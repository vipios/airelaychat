name: Build IPA

# 推代码就自动出一个未签名的 .ipa：
#   - 巨魔 / TrollStore：直接装
#   - 有证书：用 Sideloadly / 爱思助手 重签后装
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # 2026-10-31：macos-14 的 job 一起就被取消（started 和 completed 同一秒，
    # 一个 step 都没跑，没有任何 annotation）。同仓库的 ubuntu-latest 秒过，
    # 换成 macos-15 后正常跑起来了 —— 是那个 runner 镜像的问题，不是代码问题。
    # 所以这里固定用 macos-15，别再改回 14。
    runs-on: macos-15
    timeout-minutes: 30

    # 发 Release 需要写权限。默认 GITHUB_TOKEN 是只读的，
    # 少了这一段会在创建 release 那步报 403。
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 查看 Xcode 版本
        run: xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        env:
          # 家里的地址上报渠道（Gist）。源码里只留占位符，
          # 真实值从 GitHub Secret 注入，公开仓库也不会泄露。
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_OWNER: ${{ secrets.GIST_OWNER }}
          PUBLIC_DOMAIN: ${{ secrets.PUBLIC_DOMAIN }}
        run: |
          xcodegen generate
          ls -d *.xcodeproj
          echo "=== 原始工程格式 ==="
          grep -m1 "objectVersion" AIRelayChat.xcodeproj/project.pbxproj || true

          # XcodeGen 新版输出 objectVersion=77（Xcode 16 格式），
          # runner 上是 Xcode 15.x 会报 "future Xcode project file format"。
          # 直接把格式号改成 56（Xcode 15 兼容），工程结构本身没变，可安全降级。
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' AIRelayChat.xcodeproj/project.pbxproj
          sed -i '' 's/objectVersion = 70;/objectVersion = 56;/' AIRelayChat.xcodeproj/project.pbxproj
          echo "=== 修正后格式 ==="
          grep -m1 "objectVersion" AIRelayChat.xcodeproj/project.pbxproj || true

          # 把 Secret 直接替换进 Info.plist 里的占位符。
          # 只改 CI 工作区里的这份副本，仓库里的源文件保持 $(GIST_ID) 不变，
          # 所以公开仓库看不到真实 ID。
          if [ -n "${GIST_ID}" ]; then
            /usr/libexec/PlistBuddy -c "Set :AIRelayGistId ${GIST_ID}" Info.plist
            echo "GIST_ID 已注入 (${#GIST_ID} 字符)"
          else
            /usr/libexec/PlistBuddy -c "Delete :AIRelayGistId" Info.plist 2>/dev/null || true
            echo "::warning::GIST_ID 为空 —— 在外自动找地址会失效"
          fi
          if [ -n "${GIST_OWNER}" ]; then
            /usr/libexec/PlistBuddy -c "Set :AIRelayGistOwner ${GIST_OWNER}" Info.plist
            echo "GIST_OWNER 已注入"
          else
            /usr/libexec/PlistBuddy -c "Delete :AIRelayGistOwner" Info.plist 2>/dev/null || true
            echo "::warning::GIST_OWNER 为空"
          fi
          echo "=== 注入结果（不打印真实值） ==="
          /usr/libexec/PlistBuddy -c "Print :AIRelayGistId" Info.plist 2>/dev/null | head -c 4 | sed 's/$/****/' || echo "(无)"

          # 固定域名同样从 Secret 注入。没有 Secret 时留空，
          # App 会自动跳过域名这条路（退回裸 IPv6），不会崩。
          if [ -n "${PUBLIC_DOMAIN}" ]; then
            /usr/libexec/PlistBuddy -c "Set :AIRelayPublicDomain ${PUBLIC_DOMAIN}" Info.plist
            echo "PUBLIC_DOMAIN 已注入 (${#PUBLIC_DOMAIN} 字符)"
          else
            /usr/libexec/PlistBuddy -c "Delete :AIRelayPublicDomain" Info.plist 2>/dev/null || true
            echo "::warning::PUBLIC_DOMAIN 为空 —— 在外面只能退回裸 IPv6"
          fi

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project AIRelayChat.xcodeproj \
            -scheme AIRelayChat \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/build.log

      # 编译失败时，把 error 行写进 job summary。
      # 这样即使 artifact 日志下载不了（blob 鉴权/未生成），
      # 也能通过 API 读到具体报错，不用反复猜。
      - name: 失败时导出错误摘要
        if: failure()
        run: |
          {
            echo "## 编译错误"
            echo '```'
            grep -E "error:" /tmp/build.log | sed 's/^[[:space:]]*//' | sort -u | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: 打包成 .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/AIRelayChat.app"
          if [ ! -d "$APP" ]; then
            echo "找不到 .app，实际产物如下："
            find build/Build/Products -maxdepth 3 -name "*.app" || true
            exit 1
          fi
          rm -rf Payload AIRelayChat.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry AIRelayChat.ipa Payload
          ls -lh AIRelayChat.ipa
          echo "=== 包内结构 ==="
          unzip -l AIRelayChat.ipa | head -15

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: AIRelayChat-ipa
          path: AIRelayChat.ipa
          retention-days: 90

      # ---- 发布滚动 Release（固定 tag "latest"）----
      #
      # 2026-11-04 加。用户问「之前怎么能直接刷新到更新」——
      # 因为 TrollStore / 巨魔那类安装器是**轮询一个固定下载地址**来判断有没有新版，
      # 而不是读 artifact。TrollAgent 一直这么做（tag 固定为 latest），
      # 所以它每次推完代码，手机上打开 TrollStore 就能看到「有新版本」。
      #
      # 这个聊天 App 之前只有 upload-artifact：artifact 是 CI 内部产物，
      # 90 天后过期，安装器根本不知道它存在 —— 手机自然永远刷不出更新。
      # 现在补上同样的发布步骤，地址变成固定的：
      #   https://github.com/vipios/airelaychat/releases/download/latest/AIRelayChat.ipa
      #
      # 为什么每次先删再建：Release 的 tag 不能复用同名附件，
      # 用 --clobber 也可以，但删掉重建更干净（旧附件不会越积越多）。
      - name: 发布 latest Release（供 TrollStore 自动更新）
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" \
                build/Build/Products/Release-iphoneos/AIRelayChat.app/Info.plist)
          echo "版本：$VER"
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest AIRelayChat.ipa \
            --title "AIRelayChat latest (v$VER)" \
            --notes "滚动构建（main 分支最新）。供 TrollStore / 巨魔自动更新使用。

          - 版本：$VER
          - 未签名，TrollStore 直接装，或用证书自签
          - 下载：https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/AIRelayChat.ipa" \
            || gh release upload latest AIRelayChat.ipa --clobber
