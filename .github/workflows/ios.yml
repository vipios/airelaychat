name: Build IPA

# 推代码就自动出一个未签名的 .ipa：
#   - 巨魔 / TrollStore：直接装
#   - 有证书：用 Sideloadly / 爱思助手 重签后装
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 查看 Xcode 版本
        run: xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        env:
          # 家里的地址上报渠道（Gist）。源码里只留占位符，
          # 真实值从 GitHub Secret 注入，公开仓库也不会泄露。
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_OWNER: ${{ secrets.GIST_OWNER }}
        run: |
          xcodegen generate
          ls -d *.xcodeproj
          echo "=== 原始工程格式 ==="
          grep -m1 "objectVersion" AIRelayChat.xcodeproj/project.pbxproj || true

          # XcodeGen 新版输出 objectVersion=77（Xcode 16 格式），
          # runner 上是 Xcode 15.x 会报 "future Xcode project file format"。
          # 直接把格式号改成 56（Xcode 15 兼容），工程结构本身没变，可安全降级。
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' AIRelayChat.xcodeproj/project.pbxproj
          sed -i '' 's/objectVersion = 70;/objectVersion = 56;/' AIRelayChat.xcodeproj/project.pbxproj
          echo "=== 修正后格式 ==="
          grep -m1 "objectVersion" AIRelayChat.xcodeproj/project.pbxproj || true

          # 把 Secret 直接替换进 Info.plist 里的占位符。
          # 只改 CI 工作区里的这份副本，仓库里的源文件保持 $(GIST_ID) 不变，
          # 所以公开仓库看不到真实 ID。
          if [ -n "${GIST_ID}" ]; then
            /usr/libexec/PlistBuddy -c "Set :AIRelayGistId ${GIST_ID}" Info.plist
            echo "GIST_ID 已注入 (${#GIST_ID} 字符)"
          else
            /usr/libexec/PlistBuddy -c "Delete :AIRelayGistId" Info.plist 2>/dev/null || true
            echo "::warning::GIST_ID 为空 —— 在外自动找地址会失效"
          fi
          if [ -n "${GIST_OWNER}" ]; then
            /usr/libexec/PlistBuddy -c "Set :AIRelayGistOwner ${GIST_OWNER}" Info.plist
            echo "GIST_OWNER 已注入"
          else
            /usr/libexec/PlistBuddy -c "Delete :AIRelayGistOwner" Info.plist 2>/dev/null || true
            echo "::warning::GIST_OWNER 为空"
          fi
          echo "=== 注入结果（不打印真实值） ==="
          /usr/libexec/PlistBuddy -c "Print :AIRelayGistId" Info.plist 2>/dev/null | head -c 4 | sed 's/$/****/' || echo "(无)"

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project AIRelayChat.xcodeproj \
            -scheme AIRelayChat \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/build.log

      # 编译失败时，把 error 行写进 job summary。
      # 这样即使 artifact 日志下载不了（blob 鉴权/未生成），
      # 也能通过 API 读到具体报错，不用反复猜。
      - name: 失败时导出错误摘要
        if: failure()
        run: |
          {
            echo "## 编译错误"
            echo '```'
            grep -E "error:" /tmp/build.log | sed 's/^[[:space:]]*//' | sort -u | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: 打包成 .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/AIRelayChat.app"
          if [ ! -d "$APP" ]; then
            echo "找不到 .app，实际产物如下："
            find build/Build/Products -maxdepth 3 -name "*.app" || true
            exit 1
          fi
          rm -rf Payload AIRelayChat.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry AIRelayChat.ipa Payload
          ls -lh AIRelayChat.ipa
          echo "=== 包内结构 ==="
          unzip -l AIRelayChat.ipa | head -15

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: AIRelayChat-ipa
          path: AIRelayChat.ipa
          retention-days: 90
